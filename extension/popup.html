<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lumina AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #ffffff;
      color: #111827;
      padding: 14px;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #e5e7eb;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      color: #1e1b4b;
      font-size: 14px;
    }
    .badge {
      background: #4f46e5;
      color: white;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 800;
    }
    .status-dot {
      font-size: 11px;
      font-weight: 600;
      color: #10b981;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }
    .btn {
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      border: none;
      transition: background 0.15s;
    }
    .btn-primary {
      background: #4f46e5;
      color: white;
    }
    .btn-primary:hover { background: #4338ca; }
    .btn-secondary {
      background: #f3f4f6;
      color: #374151;
      border: 1px solid #e5e7eb;
    }
    .btn-secondary:hover { background: #e5e7eb; }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      color: #6b7280;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .input-field {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 8px;
      outline: none;
    }
    .input-field:focus { border-color: #4f46e5; }
    .footer {
      font-size: 11px;
      color: #9ca3af;
      text-align: center;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #f3f4f6;
    }
    .kbd {
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      padding: 1px 4px;
      border-radius: 4px;
      font-family: monospace;
      color: #4f46e5;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span class="badge">LUMINA</span>
      <span>AI Assistant</span>
    </div>
    <span class="status-dot" id="server-status">● Checking...</span>
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="btn-scan-tab">
      <span>⚡ Scan & Solve Active Tab</span>
    </button>
    <button class="btn btn-secondary" id="btn-toggle-overlay">
      <span>👁️ Toggle In-Page Overlay (<span class="kbd">Alt+H</span>)</span>
    </button>
    <button class="btn btn-secondary" id="btn-open-sidepanel">
      <span>📖 Open Chrome Side Panel</span>
    </button>
  </div>

  <div class="section-title">Backend Configuration</div>
  <input type="text" id="backend-url" class="input-field" placeholder="http://127.0.0.1:8765" />
  <button class="btn btn-secondary" id="btn-save-settings" style="padding: 6px;">Save Settings</button>

  <div class="footer">
    <span>Hotkeys: <span class="kbd">Alt+S</span> Solve | <span class="kbd">Alt+H</span> Hide</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
